[package]
name = "distill-pets-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "distill-pets-core"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.145"
unicode-normalization = "=0.1.24"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
